services:
  papershift:
    image: ghcr.io/sm-joe/papershift-doc-converter-api:v1.0.0
    container_name: papershift-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      PAPERSHIFT_ADDR: ":8080"
      PAPERSHIFT_WORK_DIR: "/tmp/papershift"
      PAPERSHIFT_CORS_ORIGIN: "http://localhost:3000"
      PAPERSHIFT_CONVERSION_TIMEOUT_SECONDS: "120"
      PAPERSHIFT_MAX_INPUT_SIZE_BYTES: "52428800"
      PAPERSHIFT_MAX_OUTPUT_SIZE_BYTES: "104857600"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:rw,nosuid,nodev

    volumes:
      - papershift-work:/tmp/papershift

    mem_limit: 1g
    pids_limit: 256
    cpus: "2.0"

    ulimits:
      nofile:
        soft: 4096
        hard: 8192

  web:
    image: ghcr.io/sm-joe/papershift-doc-converter-web:v1.0.0
    container_name: papershift-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - papershift
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev
    mem_limit: 512m
    pids_limit: 128
    cpus: "1.0"

volumes:
  papershift-work:
