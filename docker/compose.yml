services:
  papershift:
    build:
      context: ..
      dockerfile: Dockerfile
    image: papershift-api:local
    container_name: papershift
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      PAPERSHIFT_ADDR: ":8080"
      PAPERSHIFT_WORK_DIR: "/tmp/papershift"

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp/papershift:rw,noexec,nosuid,size=512m

    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0