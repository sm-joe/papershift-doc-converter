name: Cleanup All Artifacts

on:
  workflow_dispatch:

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete all artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            console.log(`Fetching artifacts for ${owner}/${repo}...`);

            // 1. Fetch all artifacts in the repository
            const response = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              per_page: 100
            });

            const artifacts = response.data.artifacts;
            console.log(`Found ${artifacts.length} artifacts.`);

            // 2. Loop through and delete each artifact
            for (const artifact of artifacts) {
              console.log(`Deleting artifact: ${artifact.name} (ID: ${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
            }

            console.log('Artifact cleanup complete!');
