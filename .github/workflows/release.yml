name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-api:${{ github.ref_name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push API Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-api:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-api:latest

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
          tags: |
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Web Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web:${{ github.ref_name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Web Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web:latest