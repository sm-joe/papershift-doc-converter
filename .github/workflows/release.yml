name: Publish Container Packages

on:
  workflow_run:
    workflows:
      - CI Pipeline

    types:
      - completed

    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: |
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
            image: papershift-doc-converter-api
            cache_scope: api

          - name: web
            context: apps/web
            dockerfile: Dockerfile
            image: papershift-doc-converter-web
            cache_scope: web
            build_args: |
              NEXT_PUBLIC_API_URL=http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scanners: vuln
          image-ref: ${{ matrix.image }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Tag Image
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          TARGET="${REGISTRY}/${OWNER}/${IMAGE}"

          docker tag "${IMAGE}:ci" "${TARGET}:${SHA}"
          docker tag "${IMAGE}:ci" "${TARGET}:latest"

      - name: Publish Container Package
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          TARGET="${REGISTRY}/${OWNER}/${IMAGE}"

          docker push "${TARGET}:${SHA}"
          docker push "${TARGET}:latest"
