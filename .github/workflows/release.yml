name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/papershift-doc-converter

      - name: Extract web image metadata
        id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web:latest
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: ghcr.io/${{ github.repository_owner }}/papershift-doc-converter:${{ github.ref_name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan Web Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web:${{ github.ref_name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Push Web Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/papershift-doc-converter-web:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha