name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  VERSION: ${{ github.ref_name }}

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
            image: papershift-doc-converter-api
            cache_scope: api

          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
            image: papershift-doc-converter-web
            cache_scope: web
            build_args: |
              NEXT_PUBLIC_API_URL=http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          no-cache: true
          load: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ matrix.image }}:${{ env.VERSION }}
          #cache-from: type=gha,scope=${{ matrix.cache_scope }}
          #cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: ${{ matrix.image }}:${{ env.VERSION }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Image
        run: |
          docker tag \
            ${{ matrix.image }}:${{ env.VERSION }} \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ env.VERSION }}

          docker tag \
            ${{ matrix.image }}:${{ env.VERSION }} \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest

          docker push \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ env.VERSION }}

          docker push \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
