name: Publish Container Packages

on:
  workflow_run:
    workflows:
      - CI Pipeline

    types:
      - completed

    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-containers-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  changes:
    name: Validate CI Run
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    outputs:
      publish: ${{ steps.validate.outputs.publish }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}

    steps:
      - name: Validate CI Run
        id: validate
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == "push" &&
                "$BRANCH" == "main" &&
                "$CONCLUSION" == "success" &&
                "$HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Changed Paths
        id: filter
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          BASE="$(git rev-parse "${SHA}^1")"
          echo "Comparing ${BASE} to ${SHA}"

          api=false
          web=false

          while IFS= read -r file; do
            echo "Changed: $file"

            case "$file" in
              Dockerfile|.dockerignore|docker/api/*|apps/api/*|engines/*|internal/*|go.mod|go.sum|*.go)
                api=true
                ;;
            esac

            case "$file" in
              apps/web/*|docker/web/*|.dockerignore)
                web=true
                ;;
            esac
          done < <(git diff --name-only "$BASE" "$SHA")

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

          echo "API image changed: $api"
          echo "Web image changed: $web"

  publish-api:
    name: Publish API Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes

    if: needs.changes.outputs.publish == 'true' && needs.changes.outputs.api == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: papershift-doc-converter-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scanners: vuln
          image-ref: papershift-doc-converter-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Tag API Image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          TARGET="${REGISTRY}/${OWNER}/papershift-doc-converter-api"

          docker tag papershift-doc-converter-api:ci "${TARGET}:${SHA}"
          docker tag papershift-doc-converter-api:ci "${TARGET}:latest"

      - name: Publish API Image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          TARGET="${REGISTRY}/${OWNER}/papershift-doc-converter-api"

          docker push "${TARGET}:${SHA}"
          docker push "${TARGET}:latest"

  publish-web:
    name: Publish Web Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes

    if: needs.changes.outputs.publish == 'true' && needs.changes.outputs.web == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
          tags: papershift-doc-converter-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Scan Web Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scanners: vuln
          image-ref: papershift-doc-converter-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Tag Web Image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TARGET="${REGISTRY}/${OWNER}/papershift-doc-converter-web"
          docker tag papershift-doc-converter-web:ci "${TARGET}:${SHA}"
          docker tag papershift-doc-converter-web:ci "${TARGET}:latest"

      - name: Publish Web Image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TARGET="${REGISTRY}/${OWNER}/papershift-doc-converter-web"
          docker push "${TARGET}:${SHA}"
          docker push "${TARGET}:latest"
