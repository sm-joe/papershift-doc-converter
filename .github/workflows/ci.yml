name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"
  API_IMAGE: papershift-api:ci
  WEB_IMAGE: papershift-web:ci

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      api_image: ${{ steps.filter.outputs.api_image }}
      web_image: ${{ steps.filter.outputs.web_image }}
      integration: ${{ steps.filter.outputs.integration }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'docker/api/**'
              - 'apps/api/**'
              - 'engines/**'
              - 'internal/**'

            frontend:
              - 'apps/web/**'

            api_image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker/api/**'
              - 'apps/api/**'
              - 'engines/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'

            web_image:
              - 'apps/web/**'
              - 'docker/web/**'
              - '.dockerignore'

            integration:
              - 'tests/**'
              - 'apps/api/**'
              - 'apps/api/**'
              - 'internal/**'
              - 'Dockerfile'
              - 'docker/api/**'
              - 'docker/api/**'
              - 'go.mod'
              - 'go.sum'

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes

    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check Go Formatting
        run: |
          unformatted=$(gofmt -l apps engines internal)
          if [ -n "$unformatted" ]; then
            echo "Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Go
        run: go vet ./apps/... ./engines/... ./internal/...

      - name: Test Go
        run: go test ./apps/... ./engines/... ./internal/...

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Build
        run: npm run build

  api-image:
    name: Build and Scan API Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes

    if: needs.changes.outputs.api_image == 'true' || needs.changes.outputs.integration == 'true' || needs.changes.outputs.ci == 'true'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scanners: vuln
          image-ref: ${{ env.API_IMAGE }}
          format: sarif
          output: trivy-api.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload API Scan Results
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api-container

      - name: Export API Image for Integration
        if: needs.changes.outputs.integration == 'true'
        run: docker save "${{ env.API_IMAGE }}" -o "${{ runner.temp }}/api-image.tar"

      - name: Upload API Image Artifact
        if: needs.changes.outputs.integration == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: papershift-api-image
          path: ${{ runner.temp }}/api-image.tar
          retention-days: 1
          compression-level: 0

  web-image:
    name: Build and Scan Web Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes

    if: needs.changes.outputs.web_image == 'true' || needs.changes.outputs.ci == 'true'

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Scan Web Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scanners: vuln
          image-ref: ${{ env.WEB_IMAGE }}
          format: sarif
          output: trivy-web.sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Web Scan Results
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web-container


  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
      - api-image
      - backend

    if: |
      always() &&
      needs.changes.outputs.integration == 'true' &&
      needs.api-image.result == 'success' &&
      (needs.backend.result == 'success' ||
      needs.backend.result == 'skipped')

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download API Image
        uses: actions/download-artifact@v7
        with:
          name: papershift-api-image
          path: ${{ runner.temp }}/api-image

      - name: Load API Image
        run: docker load -i "${{ runner.temp }}/api-image/api-image.tar"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start PaperShift
        run: |
          docker run -d \
            --name papershift-integration \
            -p 8080:8080 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev \
            --mount type=volume,source=papershift-work,target=/tmp/papershift \
            --memory 1g \
            --pids-limit 256 \
            --cpus 2.0 \
            --ulimit nofile=4096:8192 \
            "${API_IMAGE}"

      - name: Wait for PaperShift
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              echo "PaperShift is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "PaperShift failed to become healthy"
          docker logs papershift-integration 2>&1 || true
          exit 1

      - name: Run Integration Tests
        run: go test ./tests/integration -v

      - name: Show Container Logs
        if: always()
        run: docker logs papershift-integration 2>&1 || true

      - name: Stop PaperShift
        if: always()
        run: docker rm -f papershift-integration 2>/dev/null || true
