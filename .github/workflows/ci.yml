name: CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"
  API_IMAGE: papershift-api:ci
  WEB_IMAGE: papershift-web:ci

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      api_image: ${{ steps.filter.outputs.api_image }}
      web_image: ${{ steps.filter.outputs.web_image }}
      integration: ${{ steps.filter.outputs.integration }}
      dependencies: ${{ steps.filter.outputs.dependencies }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'apps/api/**'
              - 'engines/**'
              - 'internal/**'

            frontend:
              - 'apps/web/**'

            api_image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker/api/**'
              - 'apps/api/**'
              - 'engines/**'
              - 'internal/**'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'

            web_image:
              - 'apps/web/**'
              - 'docker/web/**'
              - '.dockerignore'

            integration:
              - 'tests/integration/**'
              - 'apps/api/**'
              - 'internal/**'
              - 'Dockerfile'
              - 'docker/api/**'
              - 'go.mod'
              - 'go.sum'

            dependencies:
              - '**/go.mod'
              - '**/go.sum'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/pnpm-lock.yaml'
              - '**/yarn.lock'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/requirements*.txt'
              - '**/poetry.lock'
              - '**/pyproject.toml'

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes

    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check Go Formatting
        shell: bash
        run: |
          set -euo pipefail

          unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)

          if [[ -n "$unformatted" ]]; then
            echo "Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Go
        run: go vet ./apps/... ./engines/... ./internal/...

      - name: Test Go
        run: go test ./apps/... ./engines/... ./internal/...

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Build
        run: npm run build

  codeql-go:
    name: CodeQL Analysis (go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes

    if: needs.changes.outputs.backend == 'true'

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  codeql-javascript:
    name: CodeQL Analysis (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes

    if: needs.changes.outputs.frontend == 'true'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes

    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.dependencies == 'true'

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0

  api-image:
    name: Build and Scan API Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, backend]

    if: >-
      always() &&
      (
        needs.changes.outputs.api_image == 'true' ||
        needs.changes.outputs.integration == 'true'
      ) &&
      (
        needs.backend.result == 'success' ||
        needs.backend.result == 'skipped'
      )

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Scan API Image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scanners: vuln
          image-ref: ${{ env.API_IMAGE }}
          format: sarif
          output: trivy-api.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload API Scan Results
        if: >-
          always() &&
          github.event_name == 'push' &&
          steps.trivy.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api-container

  web-image:
    name: Build and Scan Web Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, frontend]

    if: >-
      always() &&
      needs.changes.outputs.web_image == 'true' &&
      (
        needs.frontend.result == 'success' || needs.frontend.result == 'skipped'
      )

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Scan Web Image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scanners: vuln
          image-ref: ${{ env.WEB_IMAGE }}
          format: sarif
          output: trivy-web.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Web Scan Results
        if: >-
          always() &&
          github.event_name == 'push' &&
          steps.trivy.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web-container


  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
      - api-image
      - backend

    if: >-
      always() &&
      needs.changes.outputs.integration == 'true' &&
      needs.api-image.result == 'success' &&
      (
        needs.backend.result == 'success' ||
        needs.backend.result == 'skipped'
      )

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Image for Integration
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start PaperShift
        run: |
          docker run -d \
            --name papershift-integration \
            -p 8080:8080 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev \
            --mount type=volume,source=papershift-work,target=/tmp/papershift \
            --memory 1g \
            --pids-limit 256 \
            --cpus 2.0 \
            --ulimit nofile=4096:8192 \
            "${API_IMAGE}"

      - name: Wait for PaperShift
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              echo "PaperShift is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "PaperShift failed to become healthy"
          docker logs papershift-integration 2>&1 || true
          exit 1

      - name: Run Integration Tests
        run: go test ./tests/integration -v

      - name: Show Container Logs
        if: always()
        run: docker logs papershift-integration 2>&1 || true

      - name: Stop PaperShift
        if: always()
        run: docker rm -f papershift-integration 2>/dev/null || true

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - codeql-go
      - codeql-javascript
      - backend
      - frontend
      - api-image
      - web-image
      - integration
      - dependency-review

    steps:
      - name: Validate CI results
        env:
          EVENT_NAME: ${{ github.event_name }}

          CHANGES: ${{ needs.changes.result }}

          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}

          CODEQL_GO: ${{ needs.codeql-go.result }}
          CODEQL_JS: ${{ needs.codeql-javascript.result }}

          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}

          API_IMAGE: ${{ needs.api-image.result }}
          WEB_IMAGE: ${{ needs.web-image.result }}
          INTEGRATION: ${{ needs.integration.result }}

          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          DEPENDENCIES_CHANGED: ${{ needs.changes.outputs.dependencies }}
          API_IMAGE_CHANGED: ${{ needs.changes.outputs.api_image }}
          WEB_IMAGE_CHANGED: ${{ needs.changes.outputs.web_image }}
          INTEGRATION_CHANGED: ${{ needs.changes.outputs.integration }}

        shell: bash
        run: |
          set -euo pipefail

          # Change detection must always succeed.
          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::Change detection did not succeed."
            exit 1
          fi

          check_job() {
            local name="$1"
            local result="$2"
            local relevant="$3"

            if [[ "$relevant" == "true" && "$result" != "success" ]]; then
                echo "::error::$name was relevant but finished with: $result"
                exit 1
              fi

            echo "$name: $result (relevant=$relevant)"
          }

          check_job "Backend" "$BACKEND" "$BACKEND_CHANGED"
          check_job "Frontend" "$FRONTEND" "$FRONTEND_CHANGED"

          check_job "CodeQL Go" "$CODEQL_GO" "$BACKEND_CHANGED"
          check_job "CodeQL JavaScript" "$CODEQL_JS" "$FRONTEND_CHANGED"

          dependency_review_relevant=false
          if [[ "$EVENT_NAME" == "pull_request" && "$DEPENDENCIES_CHANGED" == "true" ]]; then
            dependency_review_relevant=true
          fi

          check_job "Dependency Review" "$DEPENDENCY_REVIEW" "$dependency_review_relevant"

          api_relevant=false
          [[ "$API_IMAGE_CHANGED" == "true" || "$INTEGRATION_CHANGED" == "true" ]] && api_relevant=true

          check_job "API image" "$API_IMAGE" "$api_relevant"

          web_relevant=false
          [[ "$WEB_IMAGE_CHANGED" == "true" ]] && web_relevant=true

          check_job "Web image" "$WEB_IMAGE" "$web_relevant"

          check_job "Integration tests" "$INTEGRATION" "$INTEGRATION_CHANGED"

          echo "All applicable CI checks passed."
