name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "apps/api/**"
      - "apps/web/**"
      - "engines/**"
      - "internal/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "apps/api/**"
      - "apps/web/**"
      - "engines/**"
      - "internal/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      integration: ${{ steps.filter.outputs.integration }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'engines/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'

            frontend:
              - 'apps/web/**'

            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker/**'

            integration:
              - 'tests/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Check Go Formatting
        run: |
          unformatted=$(gofmt -l apps engines internal)
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Go
        run: go vet ./apps/... ./engines/... ./internal/...

      - name: Test Go
        run: go test ./apps/... ./engines/... ./internal/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Build
        run: npm run build

  docker:
    name: Docker & Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
      - backend
      - frontend

    if: |
      always() &&
      (
        needs.backend.result == 'success' ||
        needs.backend.result == 'skipped'
      ) &&
      (
        needs.frontend.result == 'success' ||
        needs.frontend.result == 'skipped'
      ) &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.docker == 'true' ||
        needs.changes.outputs.integration == 'true'
      )

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: papershift-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: papershift-api:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy Results to Code Scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Start PaperShift
        run: |
          docker run -d \
            --name papershift-integration \
            -p 8080:8080 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev \
            --mount type=volume,source=papershift-work,target=/tmp/papershift \
            --memory 1g \
            --pids-limit 256 \
            --cpus 2.0 \
            --ulimit nofile=4096:8192 \
            papershift-api:ci

      - name: Wait for PaperShift
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              echo "PaperShift is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "PaperShift failed to become healthy"
          docker logs papershift-integration 2>&1 || true
          exit 1

      - name: Run Integration Tests
        run: go test ./tests/integration -v

      - name: Show Container Logs
        if: always()
        run: docker logs papershift-integration 2>&1 || true

      - name: Stop PaperShift
        if: always()
        run: docker rm -f papershift-integration 2>/dev/null || true
