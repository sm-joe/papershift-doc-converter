name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"

      - "docker/**"
      - "apps/**"
      - "engines/**"
      - "internal/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "apps/**"
      - "engines/**"
      - "internal/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Download Dependencies
        run: go mod download

      - name: Check Go Formatting
        run: |
          unformatted=$(gofmt -l apps engines internal)
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Go
        run: go vet ./...

      - name: Test Go
        run: go test ./apps/... ./engines/... ./internal/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: papershift-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: papershift-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs:
      - docker

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build PaperShift Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: papershift-api:ci

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Start PaperShift
        run: |
          docker run -d \
            --name papershift-integration \
            -p 8080:8080 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev \
            --mount type=volume,source=papershift-work,target=/tmp/papershift \
            --memory 1g \
            --pids-limit 256 \
            --cpus 2.0 \
            --ulimit nofile=4096:8192 \
            papershift-api:ci

      - name: Wait for PaperShift
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "PaperShift failed to become healthy"
          docker logs papershift-integration
          exit 1

      - name: Run Integration Tests
        run: go test ./tests/integration -v

      - name: Verify container health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              echo "PaperShift is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "PaperShift failed to become healthy"
          docker logs papershift-integration
          exit 1

      - name: Show Container Logs
        if: always()
        run: docker logs papershift-integration

      - name: Stop PaperShift
        if: always()
        run: docker rm -f papershift-integration
